# Nahida Voice AI - 全局配置
# ============================

# 模型缓存目录（所有下载的模型都放在项目文件夹内）
models:
  root_dir: "models"                  # 模型根目录
  asr_dir: "models/asr"               # ASR 模型
  speaker_dir: "models/speaker"       # 声纹模型
  tts_dir: "models/tts"               # TTS 模型
  vad_cache: "models/vad"             # VAD 模型缓存
  torch_hub: "models/torch_hub"       # torch.hub 缓存

# 音频参数
audio:
  sample_rate: 16000        # 采样率 (Hz)
  channels: 1               # 单声道
  chunk_size: 512           # 每帧采样点数 (32ms @ 16kHz)
  dtype: "float32"

# VAD 配置
vad:
  threshold: 0.5            # 语音检测阈值 (0-1)
  min_speech_duration: 0.25 # 最短语音段 (秒)
  min_silence_duration: 0.3 # 最短静音段 (秒)
  speech_pad: 0.1           # 语音前后填充 (秒)
  max_speech_duration: 30   # 最长语音段 (秒)

# ASR 配置 (FunASR Paraformer)
asr:
  mode: "local"             # local | websocket
  model_dir: "models/asr/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch"
  vad_model_dir: "models/asr/speech_fsmn_vad_zh-cn-16k-common-pytorch"
  punc_model_dir: "models/asr/punc_ct-transformer_zh-cn-common-vocab272727-pytorch"
  device: "cpu"             # cpu | cuda (8GB 显卡建议 CPU)
  chunk_size: 640           # 流式 ASR chunk 大小 (采样点)
  hotwords: []              # 热词列表

# TTS 配置
tts:
  mode: "gpt_sovits"         # gpt_sovits | local | api | edge

  # GPT-SoVITS v2 配置（当前主力，RTF 0.47x）
  gpt_sovits_root: "gpt_sovits/GPT_SoVITS"
  gpt_model: "pretrained_models/nahida_gpt.ckpt"
  sovits_model: "pretrained_models/nahida_sovits.pth"
  sovits_config: "GPT_SoVITS/configs/s2.json"
  device: "cuda"
  is_half: true
  sample_rate: 32000
  temperature: 0.8            # GPT采样温度（2026-06-19 全管道诊断确定最佳值：0.3→0.8，打破确定性过相干）
  top_k: 15                  # 候选k（2→15，配合高温释放token多样性）
  top_p: 1.0
  speed: 1.0
  sample_steps: 16           # 仅v3/v4的CFM起效，v2Pro走Flow不受此参数影响
  noise_scale: 0.6           # Flow噪声（默认0.5，提高到0.6配合高clip，打散相位相关）
  lp_cutoff: 0               # 低通滤波（关闭。notch/bandstop均无改善，问题不在频率尖峰）
  fade_in_ms: 60             # 句首淡入时长(ms)
  noise_clip: 4.0            # Flow方差裁剪上限（2.0→4.0，Flow方差峰值2.22，2.0削平了方差导致噪声不足）
  onset_lp_ms: 0             # 起音加强低通(ms)，0=禁用
  onset_lp_cutoff: 3500      # （已禁用）
  onset_xfade_ms: 50         # （已禁用）
  stream_chunk_ms: 200       # 流式分块时长 (ms)
  prompt_wav: "nahida/slicer_opt_trimmed/trimmed_vo_HSEQ002_11_nahida_12.wav"
  prompt_text: "我没事。最近我的空余时间有不少，又听说奥摩斯港很热闹，就过来到处走走看看。"

# Speaker ID 配置 (FunASR CAM++)
speaker_id:
  enabled: false            # Phase 2: 设为 true 启用
  model_dir: "models/speaker/speech_campplus_sv_zh-cn_16k-common"  # CAM++ 中文模型
  device: "cpu"             # cpu 即可，38MB 模型
  threshold: 0.75           # 声纹匹配阈值
  embedding_dim: 192        # 嵌入向量维度
  database_path: "voiceprint/db/embeddings.pkl"

# LLM 配置
llm:
  mode: "api"               # local | api
  # API 模式
  api_provider: "deepseek"  # deepseek | openai | zhipu
  api_key: ""               # API Key (建议用环境变量 NAHIDA_LLM_API_KEY)
  api_base_url: ""          # API Base URL
  model: "deepseek-chat"    # 模型名称
  # 本地模式
  local_model_path: ""      # 本地模型路径
  device: "cuda"
  max_tokens: 512           # 最大回复长度
  temperature: 0.7
  top_p: 0.9
  stream: true              # 流式输出

# 对话配置
conversation:
  max_history: 20           # 最大对话轮次
  system_prompt_file: "prompts/system_prompt.txt"
  tts_style_file: "prompts/tts_style.txt"
  greeting: "你好呀，旅行者！今天过得怎么样？"

# 管道配置
pipeline:
  interruption_enabled: true    # 支持打断
  interruption_threshold: 0.3   # 打断检测阈值
  overlap_asr_tts: true         # ASR/TTS 重叠
  buffer_duration: 0.5          # 音频缓冲时长 (秒)

# 日志
logging:
  level: "INFO"            # DEBUG | INFO | WARNING | ERROR
  file: "logs/nahida.log"
  console: true
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
