<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk Pet</title>
    <!-- Live2D Cubism Core 预加载：提前下载 WASM 运行时（仅主窗需要） -->
    <script>
      if (!location.search.includes('panel=')) {
        document.write('<link rel="preload" as="script" href="/Core/live2dcubismcore.min.js" />');
      }
    </script>
    <style>
      /* 首屏加载遮罩：在 React/JS 解析前即渲染，避免透明窗体空白期无反馈 */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #app-loading .app-loading-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 18px 22px;
        border-radius: 14px;
        background: rgba(18, 18, 28, 0.82);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(4px);
      }
      #app-loading .app-loading-spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.18);
        border-top-color: rgba(129, 140, 248, 0.9);
        animation: app-loading-spin 0.8s linear infinite;
      }
      #app-loading .app-loading-text {
        color: rgba(255, 255, 255, 0.85);
        font-size: 12px;
        font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #app-loading.hidden {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
    </style>
  </head>

  <body>
    <script>
      // 独立面板窗口（status/chat/settings）：在 React 渲染前设置背景色，防止白闪
      // 聊天面板用浅色底，其他面板用白色
      if (location.search.includes('panel=')) {
        var bg = location.search.includes('panel=chat') ? '#f2f3f5' : '#ffffff';
        document.documentElement.style.backgroundColor = bg;
        document.body.style.backgroundColor = bg;
        // 面板窗不渲染 Live2D：#app-loading 已由上方 document.write 守卫跳过，无需遮罩
      }
      // 安全兜底：若模型加载异常导致 onReady 未触发，18s 后也淡出遮罩，避免永久空白
      window.__hideAppLoading = function () {
        var el = document.getElementById('app-loading');
        if (!el) return;
        el.classList.add('hidden');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 500);
      };
      setTimeout(window.__hideAppLoading, 18000);
      performance.mark('html-parse-end');
    </script>
    <!-- 首屏加载遮罩（仅主窗渲染；面板窗不渲染 Live2D，完全跳过此 div 以避免卡 18s 兜底） -->
    <script>
      if (!location.search.includes('panel=')) {
        document.write(
          '<div id="app-loading">' +
            '<div class="app-loading-card">' +
              '<div class="app-loading-spinner"></div>' +
              '<div class="app-loading-text">正在加载角色…</div>' +
            '</div>' +
          '</div>'
        );
      }
    </script>
    <!-- Live2D 预热：在 React 挂载前创建隐藏 canvas + WebGL 上下文，减少首帧卡顿（仅主窗需要） -->
    <script>
      if (!location.search.includes('panel=')) {
        document.write('<canvas id="splash-webgl-warmup" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none;" aria-hidden="true"></canvas>');
      }
    </script>
    <script>
      (function() {
        try {
          var canvas = document.getElementById('splash-webgl-warmup');
          if (!canvas) return;
          var ctx = canvas.getContext('webgl2', { antialias: false, alpha: false })
                    || canvas.getContext('webgl', { antialias: false, alpha: false });
          if (!ctx) return;
          // 预热完成：后续 Live2D 可直接复用驱动/着色器编译状态
          window.__splashWebglReady = true;
        } catch (e) {
          // 忽略预热失败，不影响主流程
        }
      })();
    </script>
    <div id="root"></div>
    <!-- defer: 并行下载不阻塞 HTML 解析，DOMContentLoaded 前执行（仅主窗需要 Live2D Core） -->
    <script>
      if (!location.search.includes('panel=')) {
        document.write('<script defer src="/Core/live2dcubismcore.min.js"><\/script>');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
