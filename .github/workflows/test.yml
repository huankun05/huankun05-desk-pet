name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Electron installation
        run: npx electron --version

      - name: Build
        run: pnpm run build

      - name: E2E smoke (Electron app)
        if: success() || failure()
        run: npx playwright test --reporter=line

      - name: Unit tests (grouped, continue on failure)
        if: success() || failure()
        shell: bash
        run: |
          groups=(
            "src/main/orchestrator/vendors"
            "src/main/orchestrator/structured-output"
            "src/main/orchestrator/tools"
            "@orchestrator-root"
            "src/main/music"
            "src/main/memory"
            "src/main/channels src/main/chats src/main/chat src/main/cita"
            "src/main/screenshot src/main/rag src/main/scheduler src/main/proactive"
            "src/main/skills src/main/social-context src/main/relationship src/main/runtime-policy src/main/game-bot"
            "@main-root"
            "src/plugins"
            "src/renderer"
            "src/shared src/cli"
            "skills"
          )
          fail=0
          for g in "${groups[@]}"; do
            if [ "$g" = "@orchestrator-root" ]; then
              files=$(find src/main/orchestrator -maxdepth 1 -name "*.test.ts" 2>/dev/null)
              [ -z "$files" ] && continue
              g="$files"
            elif [ "$g" = "@main-root" ]; then
              files=$(find src/main -maxdepth 1 -name "*.test.ts" 2>/dev/null)
              [ -z "$files" ] && continue
              g="$files"
            fi
            echo "=== vitest: $g ==="
            if ! npx vitest run --reporter=verbose --maxWorkers=1 $g; then
              fail=1
            fi
          done
          exit $fail
